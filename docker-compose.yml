services:
  backend:
    build: ./backend
    # docs/45: --reload-dir app -- 기본값(/app 전체)은 바인드 마운트된 Windows
    # .venv(디렉터리 2,000여 개)까지 감시하다 watchfiles가 "Cannot allocate
    # memory (os error 12)"로 죽어 코드 변경이 조용히 반영 안 되는 실제 문제가
    # 있었다. --timeout-keep-alive 75 -- 기본 5초면 브라우저가 막 닫히는 유휴
    # 연결에 POST(틱 진행)를 실어 보내 "Failed to fetch"가 나는 경쟁이 생길 수 있다.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --timeout-keep-alive 75
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      # docs/46: --reload-dir app만으로는 부족했다 -- 감시 범위를 줄인 뒤에도 watchfiles가
      # 다시 "Cannot allocate memory (os error 12)"로 죽었다(2026-09-28 12:58). Docker Desktop의
      # Windows 바인드 마운트에서 inotify 자체가 불안정하므로 폴링 방식으로 강제한다.
      - WATCHFILES_FORCE_POLLING=true

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      # Turbopack (this project's `next dev` default) ignores WATCHPACK_POLLING
      # (a webpack-only knob) — the actual polling fallback for Docker
      # Desktop/WSL2 bind mounts is next.config.ts's `watchOptions.pollIntervalMs`.
    depends_on:
      - backend

volumes:
  frontend_node_modules:
  frontend_next_cache:
